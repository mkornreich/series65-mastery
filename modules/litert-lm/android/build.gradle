plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.litertlm'
version = '0.1.0'

android {
  namespace 'expo.modules.litertlm'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google's LiteRT-LM runtime — runs .litertlm models on CPU/GPU/NPU, the same
  // engine used by the AI Edge Gallery. 0.9.0-alpha06 is the newest release whose
  // Kotlin metadata (2.2.0) the project's Kotlin 2.1 compiler can read (0.11.0+ use 2.3.0).
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.9.0-alpha06'
}
