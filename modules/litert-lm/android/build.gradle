plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.litertlm'
version = '0.1.0'

android {
  namespace 'expo.modules.litertlm'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google's LiteRT-LM runtime — runs .litertlm models on CPU/GPU/NPU, the same
  // engine (and version) as the AI Edge Gallery. 0.11.0 adds GPU support for
  // Gemma-4's int4 tensors; its Kotlin 2.3 metadata needs the project's Kotlin 2.3 bump.
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
}
